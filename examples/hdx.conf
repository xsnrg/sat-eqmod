# sateqd mount profile — Orion HDX-110 EQ-G (SynScan EQ8-class board).
# Install at: ~/.config/sateq/mounts/hdx.conf
# Start with:  sateqd --mount hdx --orientation altaz
#
# NOTE: the HDX handset jack is 3.3 V logic — use a 3.3 V FTDI (and/or ~1 k
# series resistors on PC->mount TX). Its 12 V rail on pins 7/8 dies with the
# mount power switch; always confirm the mount lamp before trusting silence.

# Resolve by by-id; confirm which FTDI is which before first connect (lsusb).
port = /dev/serial/by-id/usb-FTDI_TTL232R_HDX-if00-port0

# Live :e1 low byte must be 0x04 (EQ8 class) or sateqd refuses to move.
mount_code = 0x04

# Signs assume the same Synta convention as the Sirius (+1/+1); re-verify on
# the HDX the first time motion is consented.
ra_sign = 1
dec_sign = 1

# EQ8-class: home-encoder (:d) available. Logged at startup as telemetry
# only — we never :F-zero the counters.
home_sensor = true

min_elevation_deg = -15
# Datum-relative travel envelope per axis (default 105/105, 0 disables one
# axis; range-checked 0 or 5..180). 105 is the SIRIUS bench stand's limit —
# MEASURE this stand's true limits and set them here before trusting a pass.
# ra_travel_deg = 105
# dec_travel_deg = 105
track_stop_el = -5
max_rate_x_sidereal = 600

# park_az / park_el: required for polar sessions; omit for alt-az (level EAST).
# park_az = 180
# park_el = 60
