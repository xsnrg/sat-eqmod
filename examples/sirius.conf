
# Glide HIGH permission gate 2.5 (2026-11-21 replay A/B): cuts GT2-cadence
# near-horizon dither :K 3-6 % at flat tracking error on throttled-client
# datasets (SO-50/LUCA/FO29). Code default 2.0 stays for fast clients
# (1 Hz m-meridional climb pays lag above 2.0); revert = delete this line.
high_gate_err_deg = 2.5
# sateqd mount profile — Sirius EQ-G (SynScan HEQ5-class board) at the bench.
# Install at: ~/.config/sateq/mounts/sirius.conf
# Start with:  sateqd --mount sirius --orientation altaz
#
# A profile describes the MOUNT + its cable, never the head orientation:
# the same mount runs polar or alt-az sessions (that is a per-session choice).

# Always use the by-id path — ttyUSB numbers swap with plug order.
port = /dev/serial/by-id/usb-FTDI_TTL232R_FTA67MMH-if00-port0

# Refuse to drive anything but this board: live :e1 low byte must be 0x01
# (HEQ5 class) or sateqd exits without moving. Verified 2026-11-15.
mount_code = 0x01

# Motor direction conventions. ra_sign = -1: webcam-oracle probes 2026-11-19
# (home set by hand, tube level-east): RA counter + tilts the tube UP while
# the AltAzLevel model computes el < 0 there — the RA/tilt axis is physically
# mirrored vs the model at this home pose. DEC probes (+ -> tube swings N,
# - -> back S to home) match the model, so dec_sign stays +1. NOTE: Phase-1's
# "signs live-verified" only proved counter-direction vs the :f backward bit
# (board wiring); it cannot see a tube-vs-sky mirror. See AGENTS.md.
ra_sign = -1
dec_sign = 1

# Home encoder: the HEQ5 ACKs :d but returns a :j-identical value (no real
# aux encoder). We gate home-sensor USE on the :q EQ8-features probe (NAK
# here = absent), never on the :d reply itself.
home_sensor = false

# Hard mechanical floor, deg: pure safety backstop (a track never goes this
# low; SafetyMonitor blocks any pointing below it, even bogus targets).
min_elevation_deg = -15

# Datum-relative mechanical travel envelope, deg per axis: the tube may not
# wind more than this from the calibrated home/datum pose IN EITHER DIRECTION
# on either kinematic branch (canonical or over-the-top — the flip branch is
# checked too, so "over the top" stays legal while stand strikes are not).
# RA (the cable/stand-limited axis): 105 deg is this bench stand's measured
# limit — on 2026-11-19 a GT2 pre-aim pushed az 306.8/0, whose only axis
# solution winds RA ~150-180 deg, and the tube hit the stand (RA stalled at
# 600x and the 12 V rail browned out the interface).
# DEC (the unobstructed shaft axis): 180 == unlimited — envelope offsets fold
# to (-180,180], so 180 never refuses; mechanically ~182 (operator-confirmed,
# 2026-11-19). Stay-out-of-the-dirt is COUPLED geometry (the DEC axis digs
# only when horizontal near RA +-90) and is enforced by the tracking policy
# (steer only to el >= 0 sky pointings, AOS..LOS), not by the axis box.
# With RA 105 + DEC 180 the dome covers 100% of the sky (tools/analysis/
# dome_coverage.cpp). Refused targets are non-latching: the tracker drives
# back to the datum and resumes on the next legal push. 0 disables one axis.
ra_travel_deg = 105
dec_travel_deg = 180

# Operational track gate, deg: command motion only at/above this elevation.
# Arm at -5 rising (the board's 15-25 s acceleration ramp finishes before
# AOS), stop at radio LOS on the way down. The target stays valid, so the
# next pass re-arms by itself.
track_stop_el = -5

# Rate cap, x sidereal. Phase-1: board free-runs past this; 600 is a chosen
# safe envelope, not a board limit.
max_rate_x_sidereal = 600

# Polar sessions MUST state the park pose (the operator's start pose:
# approximately polar-aligned, tube at the stated sky pointing). For alt-az
# sessions omit this and the agreed start pose (tube level, due EAST) is used.
# park_az = 180
# park_el = 60
