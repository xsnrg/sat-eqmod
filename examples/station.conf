# sateqd station config — one per physical station.
# Install at: ~/.config/sateq/station.conf
#
# Precedence: CLI flags > mount profile > this file. Keys here apply to
# every mount at this site unless a profile overrides them.

# Observer location, degrees east-positive. SAMPLE SITE (not the author's
# bench) — replace with your own location; pointing accuracy depends on it.
lat = 45.00
lon = -93.00

# Where mount profiles live (optional; defaults shown).
# mounts_dir = ~/.config/sateq/mounts
# state_dir  = ~/.local/state/sateq

# rotctld TCP port for all mounts at this station (optional, default 4533).
# A station running two sateqd instances (one per mount) gives one of them
# a different port in its profile or on the command line.
# rotctld_port = 4533
